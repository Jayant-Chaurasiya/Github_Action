name: Copy getData file to Another Repo

on:
  push:
    branches: [Jayant-Chaurasiya-ver-1]    

jobs:
  copy-file:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source repository
      uses: actions/checkout@v3

    - name: Checkout target repository
      uses: actions/checkout@v3
      with:
        repository: Jayant-Chaurasiya/DEMO_ZIP_TOOL
        token: ${{ secrets.TARGET_REPO_TOKEN }}
        path: DEMO_ZIP_TOOL

    - name: List demo folder contents
      run: ls -la Demo || echo "Demo folder not found"
    - name: Copy getData file to target repository demo folder
      run: |

      
        mkdir -p DEMO_ZIP_TOOL/Demo2
        cp  Demo/GetData.txt DEMO_ZIP_TOOL/Demo2/
    - name: Commit and push changes to target repo
      run: |
        cd DEMO_ZIP_TOOL
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        
        git add DEMO_ZIP_TOOL/Demo2/GetData.txt
        
        # Check if there are any changes to commit
        if git diff --cached --quiet; then
          echo "No changes to commit"
          exit 0
        fi
        
        git commit -m "Add GetData.txt to Demo2 folder"
        git push origin main
