name: Sync folder to another repo

on:
  push:
    branches: [main]                # change if needed
    paths: ["Demo/**"]    # folder to watch in source repo
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Checkout target
        uses: actions/checkout@v4
        with:
          repository: Jayant-Chaurasiya/DEMO_ZIP_TOOL     # change
          token: ${{ secrets.TARGET_REPO_TOKEN }}  # PAT secret
          path: target
          ref: main                                # target branch

      - name: Copy and push
        run: |
          rm -rf target/path/in/target            # where to place folder in target repo
          mkdir -p target/path/in/target
          cp -a path/to/folder/. target/path/in/target/

          cd target
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes" || {
            git commit -m "Sync folder from $GITHUB_REPOSITORY@$GITHUB_SHA"
            git push origin HEAD:main             # change if target branch differs
          }
